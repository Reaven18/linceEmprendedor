# OpenAPI Base — API Lince Emprendedor
openapi: 3.0.3

info:
  title: API Lince Emprendedor
  description: API del sistema desarrollada en Laravel
  version: 1.0.0

servers:
  - url: http://localhost:8000/api
    description: Servidor local

tags:
  - name: Auth
    description: Autenticación de usuarios

  - name: Categorias
    description: Gestión de categorías
  - name: Productos
    description: Gestión de productos

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    Rol:
      type: object

      properties:

        id:
          type: integer
          example: 3

        nombre:
          type: string
          example: Admin

    Usuario:
      type: object

      properties:

        id:
          type: integer
          example: 1

        nombre:
          type: string
          example: Administrador del Sistema

        correo:
          type: string
          format: email
          example: admin@test.com

        telefono:
          type: string
          example: "1234567890"

        carrera:
          type: string
          example: N/A

        latitud:
          type: number
          nullable: true
          example: 20.5234

        longitud:
          type: number
          nullable: true
          example: -100.8123

        negocio_activo:
          type: boolean
          example: false

        baneado:
          type: boolean
          example: false

        created_at:
          type: string
          format: date-time

        updated_at:
          type: string
          format: date-time

        roles:
          type: array

          items:
            $ref: '#/components/schemas/Rol'

    Producto:
      type: object

      properties:

        id:
          type: integer
          example: 1

        id_vendedor:
          type: integer
          example: 2

        nombre:
          type: string
          example: Galletas Principe

        descripcion:
          type: string
          example: Paquete con 12 galletas sabor chocolate.

        precio:
          type: string
          example: "25.00"

        stock:
          type: integer
          example: 25

        es_perecedero:
          type: boolean
          example: true

        status:
          type: string
          example: disponible

        created_at:
          type: string
          format: date-time

        updated_at:
          type: string
          format: date-time

        vendedor:
          $ref: '#/components/schemas/Usuario'

        categorias:
          type: array

          items:
            $ref: '#/components/schemas/Categoria'

        imagenes:
          type: array

          items:
            $ref: '#/components/schemas/ImagenProducto'
    ImagenProducto:
      type: object

      properties:

        id:
          type: integer
          example: 1

        id_producto:
          type: integer
          example: 3

        url_imagen:
          type: string
          example: https://site.com/1.jpg

        orden:
          type: integer
          example: 1

        created_at:
          type: string
          format: date-time

        updated_at:
          type: string
          format: date-time
    MetodoPago:
      type: object

      properties:

        id:
          type: integer
          example: 2

        metodo:
          type: string
          example: Efectivo
    Venta:
      type: object

      properties:

        id:
          type: integer
          example: 9

        id_cliente:
          type: integer
          example: 2

        lugar:
          type: string
          example: UTICS

        latitud:
          type: number
          nullable: true
          example: null

        longitud:
          type: number
          nullable: true
          example: null

        status:
          type: string
          enum:
            - pendiente
            - confirmada
            - cancelada
            - entregada
          example: confirmada

        fecha:
          type: string
          format: date-time

        created_at:
          type: string
          format: date-time

        updated_at:
          type: string
          format: date-time

        cliente:
          $ref: '#/components/schemas/Usuario'

        detalles:
          type: array

          items:
            $ref: '#/components/schemas/DetalleVenta'

        transaccion:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Transaccion'
    DetalleVenta:
      type: object

      properties:

        id:
          type: integer

        cantidad:
          type: integer

        precio_unitario:
          type: string
          example: "10.00"

        id_venta:
          type: integer

        id_producto:
          type: integer

        producto:
          $ref: '#/components/schemas/Producto'
    Transaccion:
      type: object

      properties:

        id:
          type: integer

        id_venta:
          type: integer

        consecutivo:
          type: integer

        total:
          type: string
          example: "10.00"

        id_metodo_de_pago:
          type: integer

        metodo_pago:
          $ref: '#/components/schemas/MetodoPago'

        created_at:
          type: string
          format: date-time

        updated_at:
          type: string
          format: date-time
#Auth Schemas
    LoginRequest:
      type: object

      required:
        - correo
        - password

      properties:

        correo:
          type: string
          format: email
          example: admin@test.com

        password:
          type: string
          format: password
          example: admin123

    RegisterRequest:
      type: object

      required:
        - nombre
        - correo
        - password
        - password_confirmation
        - telefono
        - carrera
        - id_rol

      properties:

        nombre:
          type: string
          example: Emilio Ruiz

        correo:
          type: string
          format: email
          example: 22030128@itcelaya.edu.mx

        password:
          type: string
          format: password
          example: 12345678

        password_confirmation:
          type: string
          format: password
          example: 12345678

        telefono:
          type: string
          example: "4614103540"

        carrera:
          type: string
          example: Ingeniería en Sistemas Computacionales

        id_rol:
          type: integer
          example: 2
    LoginSuccessResponse:
      type: object

      properties:

        success:
          type: boolean
          example: true

        data:
          type: object

          properties:

            token:
              type: string
              example: 6|HUVaMm3bOYWpK9iumZmh5xO83KqG2vm8sYqwYD6W34e2488d

            user:
              $ref: '#/components/schemas/Usuario'

        message:
          type: string
          example: Usuario autenticado con éxito.

    RegisterSuccessResponse:
      type: object

      properties:

        success:
          type: boolean
          example: true

        data:
          $ref: '#/components/schemas/Usuario'

        message:
          type: string
          example: Usuario registrado correctamente.
    MeResponse:
      type: object

      properties:

        success:
          type: boolean
          example: true

        data:
          $ref: '#/components/schemas/Usuario'

        message:
          type: string
          example: Datos del usuario autenticado.
    LogoutResponse:
      type: object

      properties:

        success:
          type: boolean
          example: true

        data:
          type: array
          example: []

        message:
          type: string
          example: Sesión cerrada correctamente.
#Categorias Schemas
    Categoria:
      type: object

      properties:

        id:
          type: integer
          example: 2

        nombre:
          type: string
          example: Bebidas

    CategoriaDetalle:
      type: object

      properties:

        id:
          type: integer
          example: 2

        nombre:
          type: string
          example: Bebidas

        productos:
          type: array

          items:
            $ref: '#/components/schemas/Producto'
    CategoriasResponse:
      type: object

      properties:

        success:
          type: boolean
          example: true

        data:
          type: array

          items:
            $ref: '#/components/schemas/Categoria'

        message:
          type: string
          example: Categorías obtenidas correctamente.

    CategoriaDetalleResponse:
      type: object

      properties:

        success:
          type: boolean
          example: true

        data:
          $ref: '#/components/schemas/CategoriaDetalle'

        message:
          type: string
          example: Categoría obtenida correctamente.
    CategoriaRequest:
      type: object

      required:
        - nombre

      properties:

        nombre:
          type: string
          example: Dulces
    CategoriaResponse:
      type: object

      properties:

        success:
          type: boolean
          example: true

        data:
          $ref: '#/components/schemas/Categoria'

        message:
          type: string
          example: Categoría creada correctamente.
#Productos Schemas
    ProductoRequest:
      type: object

      required:
        - nombre
        - descripcion
        - precio
        - stock
        - es_perecedero
        - status
        - categorias

      properties:

        nombre:
          type: string
          example: Galletas Principe

        descripcion:
          type: string
          example: Paquete con 12 galletas sabor chocolate.

        precio:
          type: number
          format: float
          example: 25.0

        stock:
          type: integer
          example: 25

        es_perecedero:
          type: boolean
          example: true

        status:
          type: string
          example: disponible

        categorias:
          type: object

          properties:

            id:
              type: integer
              example: 4
        imagenes:
          type: array

          items:
            type: string
            format: uri

          example:
            - https://site.com/1.jpg
            - https://site.com/2.jpg
    ProductoResponse:
      type: object

      properties:

        success:
          type: boolean
          example: true

        data:
          $ref: '#/components/schemas/Producto'

        message:
          type: string
          example: Producto creado correctamente.
#Metodos de pago Schemas
    MetodoPagoRequest:
      type: object

      required:
        - metodo

      properties:

        metodo:
          type: string
          example: Efectivo
    MetodosPagoResponse:
      type: object

      properties:

        success:
          type: boolean
          example: true

        data:
          type: array

          items:
            $ref: '#/components/schemas/MetodoPago'

        message:
          type: string
          example: Métodos de pago obtenidos correctamente.

    ErrorResponse:
      type: object

      properties:

        success:
          type: boolean
          example: false

        message:
          type: string
          example: Credenciales incorrectas.

        error:
          type: string
          example: Correo o contraseña inválidos.
#Reseña de productos Schemas
    ReviewProductoRequest:
      type: object

      required:
        - id_producto
        - calificacion
        - comentario

      properties:

        id_producto:
          type: integer
          example: 3

        calificacion:
          type: integer
          example: 4

        comentario:
          type: string
          example: Esta en buen estado, solo que tardó más de lo esperado

        anonimo:
          type: boolean
          example: false
    ReviewProducto:
      type: object

      properties:

        id:
          type: integer
          example: 1

        id_cliente:
          type: integer
          example: 2

        id_producto:
          type: integer
          example: 3

        calificacion:
          type: integer
          example: 4

        comentario:
          type: string

        estado:
          type: string
          example: activa

        anonimo:
          type: boolean
          example: false

        created_at:
          type: string
          format: date-time

        updated_at:
          type: string
          format: date-time

        cliente:
          $ref: '#/components/schemas/ClienteSimple'

        producto:
          $ref: '#/components/schemas/ProductoSimple'
    ReviewProductoResponse:
      type: object

      properties:

        success:
          type: boolean
          example: true

        data:
          $ref: array
          items:
            $ref: '#/components/schemas/ReviewProducto'

        message:
          type: string
          example: Review creada correctamente.
    MisReviewsProductoResponse:
      type: object

      properties:

        success:
          type: boolean
          example: true

        data:
          type: array

          items:
            $ref: '#/components/schemas/ReviewProducto'

        message:
          type: string
          example: Reviews del usuario obtenidas correctamente.

    ClienteSimple:
      type: object

      properties:

        id:
          type: integer
          example: 2

        nombre:
          type: string
          example: Emilio Ruiz

        correo:
          type: string
          example: 22030128@itcelaya.edu.mx
    ProductoSimple:
      type: object

      properties:

        id:
          type: integer
          example: 3

        nombre:
          type: string
          example: Galletas Emperador

        descripcion:
          type: string
# Ventas Schemas
    VentaRequest:
      type: object

      required:
        - lugar
        - tipo
        - productos

      properties:

        lugar:
          type: string
          example: UTICS

        tipo:
          type: string
          example: reservada

        productos:
          type: array

          items:
            type: object

            required:
              - id_producto
              - cantidad

            properties:

              id_producto:
                type: integer
                example: 3

              cantidad:
                type: integer
                example: 1
    VentaResponse:
      type: object

      properties:

        success:
          type: boolean
          example: true

        data:
          type: object

          properties:

            id:
              type: integer

            id_cliente:
              type: integer

            lugar:
              type: string

            latitud:
              type: number
              nullable: true

            longitud:
              type: number
              nullable: true

            status:
              type: string
              example: pendiente

            fecha:
              type: string
              format: date-time

            cliente:
              $ref: '#/components/schemas/UsuarioSimple'

            detalles:
              type: array

              items:
                type: object

                properties:

                  cantidad:
                    type: integer

                  precio_unitario:
                    type: string

                  producto:
                    $ref: '#/components/schemas/Producto'

            transaccion:
              nullable: true
              type: object

        message:
          type: string
          example: Venta creada correctamente.
    ProductoNoDisponibleResponse:
      type: object

      properties:

        success:
          type: boolean
          example: false

        message:
          type: string
          example: Producto no disponible.

        errors:
          type: object

          properties:

            error:
              type: string
              example: El producto "X" no está disponible.
    StockInsuficienteResponse:
      type: object

      properties:

        success:
          type: boolean
          example: false

        message:
          type: string
          example: Stock insuficiente.

        errors:
          type: object

          properties:

            error:
              type: string
              example: El producto "X" no tiene suficiente stock.
    FiltroVentaRequest:
      type: object

      properties:

        status:
          type: string
          nullable: true

          enum:
            - confirmada
            - pagado
            - pendiente

          example: confirmada

        lugar:
          type: string
          nullable: true
          example: UTICS

        fecha:
          type: string
          format: date
          nullable: true
          example: 2026-05-19
    ValidationErrorResponse:
      type: object

      properties:

        message:
          type: string
          example: The correo has already been taken.

        errors:
          type: object

          properties:

            correo:
              type: array

              items:
                type: string

              example:
                - The correo has already been taken.

            password:
              type: array

              items:
                type: string

              example:
                - The password field confirmation does not match.

    UnauthorizedResponse:
      type: object

      properties:

        success:
          type: boolean
          example: false

        message:
          type: string
          example: No autenticado.

    ForbiddenResponse:
      type: object

      properties:

        success:
          type: boolean
          example: false

        message:
          type: string
          example: No autorizado para realizar esta acción.

    NotFoundResponse:
      type: object

      properties:

        success:
          type: boolean
          example: false

        message:
          type: string
          example: Categoría no encontrada.

        errors:
          type: object

          properties:

            error:
              type: string
              example: No existe una categoría con ese ID.

paths:

  /login:
    post:
      tags:
        - Auth

      summary: Iniciar sesión

      description: Endpoint para autenticar usuarios en el sistema.

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'

      responses:

        '200':
          description: Usuario autenticado correctamente

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'

        '401':
          description: Credenciales incorrectas

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '403':
          description: Usuario baneado

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /register:
    post:
      tags:
        - Auth

      summary: Registrar usuario

      description: Endpoint para registrar nuevos usuarios en el sistema.

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'

      responses:

        '201':
          description: Usuario registrado correctamente

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSuccessResponse'

        '422':
          description: Error de validación

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /me:
    get:
      tags:
        - Auth

      summary: Obtener usuario autenticado

      description: Regresa los datos del usuario actual autenticado.

      security:
        - bearerAuth: []

      responses:

        '200':
          description: Datos del usuario autenticado

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'

        '401':
          description: No autenticado

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
  /logout:
    post:
      tags:
        - Auth

      summary: Cerrar sesión

      description: Cierra la sesión actual del usuario autenticado.

      security:
        - bearerAuth: []

      responses:

        '200':
          description: Sesión cerrada correctamente

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'

        '401':
          description: No autenticado

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'

  /categorias:
    get:
      tags:
        - Categorias

      summary: Obtener categorías

      description: Lista todas las categorías registradas en el sistema.

      responses:

        '200':
          description: Categorías obtenidas correctamente

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriasResponse'

  /categorias/{id}:
    get:
      tags:
        - Categorias

      summary: Obtener categoría por ID

      description: Obtiene una categoría específica junto con sus productos.

      parameters:
        - name: id
          in: path
          required: true

          schema:
            type: integer

          example: 2

      responses:

        '200':
          description: Categoría obtenida correctamente

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriaDetalleResponse'

        '404':
          description: Categoría no encontrada

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
  /categorias:
    post:
      tags:
        - Categorias

      summary: Crear categoría

      description: Crea una nueva categoría en el sistema. Requiere rol Admin.

      security:
        - bearerAuth: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaRequest'

      responses:

        '201':
          description: Categoría creada correctamente

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriaResponse'

        '401':
          description: No autenticado

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'

        '403':
          description: No autorizado

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'
  /categorias/{id}:
    put:
      tags:
        - Categorias

      summary: Actualizar categoría

      description: Actualiza los datos de una categoría específica. Requiere rol Admin.

      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true

          schema:
            type: integer

          example: 3

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaRequest'

      responses:

        '200':
          description: Categoría actualizada correctamente

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriaResponse'

        '401':
          description: No autenticado

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'

        '403':
          description: No autorizado

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'

        '404':
          description: Categoría no encontrada

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
  /categorias/{id}:
    delete:
      tags:
        - Categorias

      summary: Eliminar categoría

      description: Elimina una categoría específica. Requiere rol Admin.

      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true

          schema:
            type: integer

          example: 3

      responses:

        '200':
          description: Categoría eliminada correctamente

          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EmptySuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Categoría eliminada correctamente.

        '401':
          description: No autenticado

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'

        '403':
          description: No autorizado

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'

        '404':
          description: Categoría no encontrada

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
  /productos:
    get:
      tags:
        - Productos

      summary: Obtener productos

      description: Obtiene la lista de productos registrados en el sistema.

      responses:

        '200':
          description: Productos obtenidos correctamente

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductosResponse'
  /productos:
    post:
      tags:
        - Productos

      summary: Crear producto

      description: Registra un nuevo producto. Requiere rol Vendedor.

      security:
        - bearerAuth: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoRequest'

      responses:

        '201':
          description: Producto creado correctamente

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoResponse'

        '401':
          description: No autenticado

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'

        '403':
          description: No autorizado

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponse'

        '422':
          description: Error de validación

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /productos/{id}:
    delete:
      tags:
        - Productos

      summary: Eliminar producto

      description: Elimina un producto específico. Requiere rol Vendedor.

      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true

          schema:
            type: integer

          example: 1

      responses:

        '200':
          description: Producto eliminado correctamente

          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EmptySuccessResponse'
                  - type: object
                    properties:
                      message:
