# OpenAPI 3.0 - Marketplace API

openapi: 3.0.3
info:
  title: Marketplace API
  version: 1.0.0
  description: API para marketplace universitario desarrollado con Laravel + Sanctum.

servers:
  - url: http://localhost:8000/api
    description: Servidor local

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    User:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        correo:
          type: string
        telefono:
          type: string
        carrera:
          type: string

    Categoria:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string

    Producto:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        descripcion:
          type: string
        precio:
          type: number
          format: float
        stock:
          type: integer
        status:
          type: string
        es_perecedero:
          type: boolean

    Venta:
      type: object
      properties:
        id:
          type: integer
        id_cliente:
          type: integer
        lugar:
          type: string
        status:
          type: string
        fecha:
          type: string
          format: date-time

    Review:
      type: object
      properties:
        id:
          type: integer
        calificacion:
          type: integer
        comentario:
          type: string

security:
  - bearerAuth: []

paths:

  /login:
    post:
      tags:
        - Auth
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - correo
                - password
              properties:
                correo:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login exitoso

  /register:
    post:
      tags:
        - Auth
      summary: Registrar usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                correo:
                  type: string
                password:
                  type: string
                password_confirmation:
                  type: string
                telefono:
                  type: string
                carrera:
                  type: string
                id_rol:
                  type: integer
      responses:
        '201':
          description: Usuario registrado

  /me:
    get:
      tags:
        - Auth
      summary: Obtener usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuario autenticado

  /logout:
    post:
      tags:
        - Auth
      summary: Cerrar sesión
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout exitoso

  /categorias:
    get:
      tags:
        - Categorias
      summary: Obtener categorías
      responses:
        '200':
          description: Lista de categorías

    post:
      tags:
        - Categorias
      summary: Crear categoría
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Categoria'
      responses:
        '201':
          description: Categoría creada

  /categorias/{id}:
    get:
      tags:
        - Categorias
      summary: Obtener categoría
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Categoría encontrada

    put:
      tags:
        - Categorias
      summary: Actualizar categoría
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Categoría actualizada

    delete:
      tags:
        - Categorias
      summary: Eliminar categoría
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Categoría eliminada

  /productos:
    get:
      tags:
        - Productos
      summary: Obtener productos
      responses:
        '200':
          description: Lista de productos

    post:
      tags:
        - Productos
      summary: Crear producto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Producto'
      responses:
        '201':
          description: Producto creado

  /productos/{id}:
    get:
      tags:
        - Productos
      summary: Obtener producto
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Producto encontrado

    put:
      tags:
        - Productos
      summary: Actualizar producto
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Producto actualizado

    delete:
      tags:
        - Productos
      summary: Eliminar producto
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Producto eliminado

  /ventas:
    get:
      tags:
        - Ventas
      summary: Obtener ventas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de ventas

    post:
      tags:
        - Ventas
      summary: Crear venta
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tipo:
                  type: string
                  enum:
                    - reservada
                    - pagada
                lugar:
                  type: string
                productos:
                  type: array
                  items:
                    type: object
                    properties:
                      id_producto:
                        type: integer
                      cantidad:
                        type: integer
      responses:
        '201':
          description: Venta creada

  /ventas/{id}/pagar:
    post:
      tags:
        - Ventas
      summary: Pagar venta reservada
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Venta pagada

  /mensajes:
    post:
      tags:
        - Mensajes
      summary: Enviar mensaje
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id_receptor:
                  type: integer
                contenido:
                  type: string
      responses:
        '201':
          description: Mensaje enviado

  /mensajes/conversaciones:
    get:
      tags:
        - Mensajes
      summary: Obtener conversaciones
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Conversaciones obtenidas

  /reviews/productos:
    post:
      tags:
        - Reviews Productos
      summary: Crear review de producto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id_producto:
                  type: integer
                calificacion:
                  type: integer
                comentario:
                  type: string
      responses:
        '201':
          description: Review creada

  /reviews/vendedores:
    post:
      tags:
        - Reviews Vendedores
      summary: Crear review de vendedor
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id_vendedor:
                  type: integer
                calificacion:
                  type: integer
                comentario:
                  type: string
      responses:
        '201':
          description: Review creada

  /transacciones:
    get:
      tags:
        - Transacciones
      summary: Obtener transacciones
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de transacciones


